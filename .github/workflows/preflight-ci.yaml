---
# Preflight CI — canonical test-suite execution for the framework source (BLOCKER 2).
#
# Runs the framework's OWN test suite (tests the reviewer/gates, not consumer service code) on every PR
# targeting the integration branch and on pushes to the active P0 branch. Three jobs:
#   • linux-bash      — full canonical suite on ubuntu-latest (fast spawns).
#   • windows-gitbash — canonical suite through Git Bash on windows-latest (the supported consumer host).
#   • slow-spawn      — the spawn-delay harness with PREFLIGHT_RUN_SPAWN_DELAY=1 (a dedicated, bounded job
#                       so it never inflates the main jobs' wall time).
#
# SAFETY POSTURE (matches the framework's own discipline):
#   • permissions: contents:read ONLY — no write scope, no PR/issue mutation, no automatic merge.
#   • no secrets referenced; the suite contacts NO network and NO consumer repository (all fixtures are
#     ephemeral local mktemp repos with string-only remotes).
#   • full history checkout (fetch-depth: 0) so the verifier's ancestry/tag tests have real objects+tags.
#   • concurrency cancels superseded runs on the same ref; explicit per-job timeouts.
#   • on failure, the run log is uploaded as an artifact for triage.
#
# This workflow does NOT mark a PR ready, merge, tag, or release. It only reports pass/fail.

name: Preflight CI

on:
  pull_request:
    branches:
      - feature/preflight-framework
  push:
    branches:
      - pr/p0-router-engine-split
      # future protected/release branches may be added here in lockstep with branch protection.

permissions:
  contents: read

concurrency:
  # One run per ref regardless of event: a push to pr/p0-router-engine-split AND the PR-sync event would
  # otherwise schedule two identical full-suite runs. Keyed on ref so superseded runs cancel and duplicate
  # push/PR runs for the same ref collapse to one (no lost protection — the same suite on the same SHA).
  group: preflight-ci-${{ github.ref }}
  cancel-in-progress: true

# Deterministic git identity for fixture commits on clean runners (no ambient global identity exists on
# ubuntu-latest / windows-latest; without this a fixture's `git commit` fails → no HEAD → the evidence gate
# correctly BLOCKs as stale → spurious harness failures). Set at workflow scope so EVERY job — including the
# slow-spawn job that invokes a suite directly (not via run-all-tests.sh) — inherits it. These author/
# committer env vars survive a fixture re-pointing HOME/GIT_CONFIG_GLOBAL, unlike `git config --global`.
env:
  GIT_AUTHOR_NAME: Preflight CI
  GIT_AUTHOR_EMAIL: ci@preflight.test
  GIT_COMMITTER_NAME: Preflight CI
  GIT_COMMITTER_EMAIL: ci@preflight.test

jobs:
  linux-bash:
    name: Linux Bash — canonical suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for ancestry/tag tests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mawk (cross-AWK portability coverage for the shell-structure lexer)
        run: |
          # The shell-structure lexer (lib/shell-structure-lexer.awk) is POSIX-awk and MUST produce identical
          # IR under gawk AND mawk. ubuntu-latest ships gawk (as /usr/bin/awk); install mawk so the
          # portability test (pre-bash-structure-portability-test.sh) actually exercises gawk-vs-mawk here
          # (the Windows Git-Bash host has only gawk, so this Linux job is where cross-impl divergence is
          # caught). Non-fatal if the package index is briefly unavailable — the test then self-notes single-impl.
          sudo apt-get update -y && sudo apt-get install -y mawk || echo "note: mawk install skipped (apt unavailable)"
      - name: Tooling versions
        run: |
          bash --version | head -1
          jq --version || true
          git --version
          awk --version 2>/dev/null | head -1 || true
          mawk -W version 2>&1 | head -1 || echo "mawk: absent"
      - name: Run canonical suite
        run: |
          set -o pipefail
          bash tests/run-all-tests.sh 2>&1 | tee preflight-ci-linux.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-ci-linux-log
          path: preflight-ci-linux.log
          if-no-files-found: ignore

  windows-gitbash:
    name: Windows Git-Bash — canonical suite
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # GitHub's windows-latest 'bash' is Git Bash (MSYS2) — the supported consumer host.
    steps:
      - name: Checkout (full history for ancestry/tag tests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tooling versions (confirm Git Bash)
        run: |
          uname -s
          bash --version | head -1
          jq --version || true
          git --version
      - name: Run canonical suite (Git Bash)
        run: |
          set -o pipefail
          # Full canonical suite. The suite self-SKIPs any env-unavailable case (jq/timeout) and exits
          # nonzero on ANY failed assertion — explicitly covering router, parser, continuation,
          # forbidden-remote, wrapper, PR-policy, installer, and verifier suites on the Windows host.
          bash tests/run-all-tests.sh 2>&1 | tee preflight-ci-windows.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-ci-windows-log
          path: preflight-ci-windows.log
          if-no-files-found: ignore

  slow-spawn:
    name: Slow-spawn harness (scan-on-exec tax)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run spawn-delay harness (fail-closed containment under the tax)
        env:
          PREFLIGHT_RUN_SPAWN_DELAY: "1"
        run: |
          set -o pipefail
          # The spawn-delay harness injects a per-spawn tax to recreate the Windows/CrowdStrike scan-on-exec
          # incident deterministically; run it as a DEDICATED job so it never inflates the main suites.
          # This proves the CONTAINMENT half: ordinary Bash stays fast+allowed, and a slow candidate fails
          # CLOSED (times out → BLOCK that candidate only). It does NOT prove a supported push COMPLETES —
          # the two steps below add that (Stage 2C, Phase 9).
          bash tests/behavioral/spawn-delay-harness-test.sh 2>&1 | tee preflight-ci-slowspawn.log
      - name: Candidate-path subprocess budget (host-independent latency-regression gate)
        run: |
          set -o pipefail
          # Stage 2C, Phase 9 — the DETERMINISTIC regression gate. The Stage-2B 23–25s latency was, mechanically,
          # (spawn count on the candidate path) × (per-spawn scan-on-exec tax on the Windows host). Wall-clock is
          # unmeasurable on that host (it thrashes ~5×), so this pins a CEILING on the spawn count per candidate
          # class. A change that RE-ADDS a git/find/jq/grep/awk spawn to the hot path — the exact way the original
          # latency crept in — blows the budget here, on a fast shared runner, with ZERO jitter. This is the gate
          # that WOULD have caught the original regression (the pre-2C safe-AUTO path made 28 spawns; 2C makes 20).
          bash tests/behavioral/ir-push-spawn-budget-test.sh 2>&1 | tee -a preflight-ci-slowspawn.log
      - name: Authoritative push performance under an injected spawn tax (wall-time margin)
        env:
          # Inject a per-spawn tax via a PATH shim (below) so the perf test's wall-time reflects the taxed
          # candidate path, not a fast shared runner. THRESHOLD RELATIONSHIP (documented per Phase 9):
          #   • The DEADLINE + SAFE margin are NOT hardcoded here anymore — the perf test DERIVES them from the
          #     router's own constants (_RTR_PLATFORM_TIMEOUT_S/kill-grace/overhead → the shipped 48s ceiling,
          #     43s safe). Overriding them here re-introduced the dual-source drift the derivation was added to
          #     kill (they were left at the old 23s/18s after the platform timeout moved 35s→60s). We let the
          #     single source flow through so this lane always tests against the ACTUAL shipped deadline.
          #   • This CI lane uses a SMALL injected tax (0.2s/spawn) on a fast ubuntu runner, so absolute
          #     wall-times are NOT comparable to the Windows/scan-on-exec pilot; the OPTIMIZED path (≈20 taxed
          #     spawns → ≈4s of tax over a ~1s base) clears the derived deadline with wide margin, while the
          #     pre-2C path (≈28 spawns) would be ≈1.6s slower. The spawn-budget step above is the precise,
          #     jitter-free regression gate; this step is the end-to-end wall-time confirmation that a supported
          #     push COMPLETES (does not time out / engine-fail) under a real per-spawn tax.
          # PROBE_TO is derived by the test too (ceiling + 17 = 65s); we leave it unset so the derivation applies.
          PFG_CI_SPAWN_TAX: "0.2"
        run: |
          set -o pipefail
          # Build a PATH shim that sleeps PFG_CI_SPAWN_TAX before exec'ing the real binary, for the taxed
          # families (git/jq/awk/find/grep/sed/cat/date/tr/cut/head/dirname). `timeout` and `bash` are NOT
          # shimmed (they are the test harness's own machinery — shimming them would slow the harness, not the
          # gate's work). The perf test prepends its OWN git shim inside its fixture; our tax shim still taxes
          # every non-git external spawn AND (via PATH order in the perf test's measure()) the real git reads.
          TAXDIR="$(mktemp -d)"
          for b in git jq awk gawk mawk find grep sed cat date tr cut head tail dirname basename sort; do
            real="$(command -v "$b" 2>/dev/null || true)"
            [ -n "$real" ] || continue
            {
              echo '#!/usr/bin/env bash'
              printf 'sleep "%s"\n' "$PFG_CI_SPAWN_TAX"
              printf 'exec "%s" "$@"\n' "$real"
            } > "$TAXDIR/$b"
            chmod +x "$TAXDIR/$b"
          done
          # Run the authoritative perf matrix with the tax shim ahead on PATH. It asserts: correct decision,
          # no unexpected ENGINE FAILURE, no timeout, shim-not-run for BLOCK, and bounded wall time with margin.
          PATH="$TAXDIR:$PATH" bash tests/behavioral/ir-push-perf-test.sh 2>&1 | tee -a preflight-ci-slowspawn.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-ci-slowspawn-log
          path: preflight-ci-slowspawn.log
          if-no-files-found: ignore
