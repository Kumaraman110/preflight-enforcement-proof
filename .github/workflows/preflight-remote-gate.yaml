---
# Preflight Remote Decision Gate — STAGE 2 (decide). The TRUSTED half of the two-stage split.
#
# THREAT: a pull request (especially from a FORK) is UNTRUSTED code. If the gate ran its own
# policy / verifier / entrypoint out of the PR checkout, a PR author could edit them to force
# ALLOW — the judge would be running the defendant's code. This workflow therefore runs in the
# BASE repo's TRUSTED context (triggered by `workflow_run` on the untrusted Stage 1,
# "Preflight Remote Gate — Collect"), checks out the GATE MACHINERY (verifier + policy +
# entrypoint) from the TRUSTED base ref, fetches the exact PR head commit as DATA-ONLY into
# `subject/` (never executes it), and runs the trusted verifier to re-resolve identity against
# that subject tree. Signing keys are injected ONLY here.
#
# This is the check to configure as a REQUIRED status check ("Independent remote decision gate").
# Do NOT require the Stage-1 collect check (untrusted, no verdict). See docs/remote-gate.md.
#
# SAFETY POSTURE:
#   • permissions: contents:read ONLY; no write scope, no PR/issue mutation, no merge.
#   • Does NOT modify branch protection — a documented human operator step.
#   • Signing keys come ONLY from org/repo secrets, injected here, NEVER from any repository-
#     controlled input (no CLI flag or env is wired from PR content). Distinct approver secret.
#   • Actions pinned by immutable commit SHA. Fails CLOSED: missing signing key / missing artifact /
#     identity-unresolvable / dependency-missing → non-success, never a silent ALLOW.
#
# The gate logic lives in a PORTABLE shell entrypoint (verifier/ci/remote-gate.sh), fully
# testable offline (tests/protocol/remote-gate-e2e-test.sh) with no GitHub and no network.

name: Preflight Remote Decision Gate

on:
  workflow_run:
    workflows: ["Preflight Remote Gate — Collect"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preflight-remote-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  decide:
    name: Independent remote decision gate
    # Only run once Stage 1 (collect) completed SUCCESSFULLY.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Signing keys — injected ONLY in this trusted stage, ONLY from secrets. Never from PR input.
      #  • ATTEST key signs the DECISION (output). Required (--require-attestation).
      #  • BUNDLE key authenticates the producer's EVIDENCE (input). Without it the tier/claims are
      #    trusted at face value — a fork could self-classify tier=AUTO. Requiring it closes that
      #    evidence-authenticity gap (identity re-resolution alone does NOT). Provision it.
      #  • APPROVAL key (distinct) gates REQUIRE_APPROVAL; never held by a producer.
      PREFLIGHT_ATTEST_KEY: ${{ secrets.PREFLIGHT_ATTEST_KEY }}
      PREFLIGHT_BUNDLE_KEY: ${{ secrets.PREFLIGHT_BUNDLE_KEY }}
      PREFLIGHT_APPROVAL_KEY: ${{ secrets.PREFLIGHT_APPROVAL_KEY }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GATE_REPO: ${{ github.repository }}
    steps:
      # 1. TRUSTED gate machinery: check out the BASE repo (this workflow runs in the base context;
      #    a PR author cannot alter the base ref) into gate/. Its verifier + policy + entrypoint are
      #    therefore trusted. head_branch is the Stage-1 branch name resolved in the BASE repo.
      - name: Checkout TRUSTED gate machinery (base ref)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          path: gate
          fetch-depth: 1
          persist-credentials: false

      # 2. Download Stage 1's claim (intent/bundle/approval/head-sha) — DATA, not code.
      - name: Download the collected claim
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806   # v4.1.9
        with:
          name: preflight-claim
          path: claim
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # 3. Fetch the EXACT PR head commit as DATA-ONLY into subject/ (never executed).
      - name: Materialize the subject commit (data only, never executed)
        run: |
          set -o pipefail
          HEAD_FROM_CLAIM="$(cat claim/head_sha.txt)"
          # Defense in depth: the runner-provided workflow_run.head_sha must match the claim.
          if [ "$HEAD_FROM_CLAIM" != "$HEAD_SHA" ]; then
            echo "::error::claim head_sha ($HEAD_FROM_CLAIM) != workflow_run head_sha ($HEAD_SHA) — refusing"
            exit 1
          fi
          git init -q subject
          git -C subject remote add origin "https://github.com/${GATE_REPO}.git"
          git -C subject -c protocol.version=2 fetch --depth 1 origin "$HEAD_SHA"
          git -C subject checkout -q "$HEAD_SHA"
          # Restate the origin so identity re-resolution canonicalizes the intended repo.
          echo "subject HEAD: $(git -C subject rev-parse HEAD)"

      - name: Tooling versions
        run: |
          python3 --version || python --version
          git --version
          jq --version || true

      # 4. Run the TRUSTED entrypoint from gate/, verifying the untrusted subject/ tree as DATA.
      #    --pkg-root pins the verifier+policy to the trusted checkout; --require-attestation +
      #    --require-bundle-attestation make missing signing material fail closed.
      - name: Run the independent remote decision gate (trusted verifier, untrusted subject)
        run: |
          set -o pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXPIRES="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p gate-out
          APPROVAL_ARG=""
          [ -f claim/approval.json ] && APPROVAL_ARG="--approval claim/approval.json"
          bash gate/verifier/ci/remote-gate.sh \
            --pkg-root "$PWD/gate" \
            --repo-root "$PWD/subject" \
            --intent claim/intent.json \
            --bundle claim/bundle.json \
            --policy protocol/policies/push-safety.v1.policy.json \
            --now "$NOW" --issued-at "$NOW" --expires-at "$EXPIRES" \
            --expected-repo "$GATE_REPO" \
            --run-id "$GITHUB_RUN_ID" --nonce "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --out-dir gate-out \
            --require-attestation \
            --require-bundle-attestation \
            $APPROVAL_ARG
          # Exit code IS the check result: 0 ALLOW/approved, 10 REQUIRE_APPROVAL (non-success,
          # documented), 20 BLOCK, 30 usage/fail-closed. Non-zero fails the required check.

      - name: Upload decision + attestation artifact (always, for inspection)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1   # v4.6.1
        with:
          name: preflight-remote-decision
          path: gate-out/
          if-no-files-found: warn
